<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3b3c">
<meta name="robots" content="noindex,nofollow">
<title>أسئلة الجمهور للمقدّمين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--fs:30px;--ink:#0b3b3c;--mut:#5b7f80;--gold:#c9a227}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#0b3b3c,#0f766e);color:#fff;font-family:Cairo,system-ui,Tahoma,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;background:#0b3b3cee;backdrop-filter:blur(8px);border-bottom:3px solid var(--gold)}
header h1{margin:0;font-size:20px;flex:1;min-width:200px;line-height:1.35}
header h1 small{display:block;font-size:13px;font-weight:400;opacity:.8}
.cnt{background:var(--gold);color:#3b2f00;font-weight:800;border-radius:99px;padding:4px 14px}
.tools{display:flex;gap:6px;align-items:center}
.tools button{border:0;border-radius:10px;padding:7px 12px;background:#ffffff26;color:#fff;font:700 15px Cairo,sans-serif;cursor:pointer}
.tools button.on{background:#fff;color:var(--ink)}
main{max-width:1040px;margin:0 auto;padding:6px 16px 60px}
.q{background:#fff;color:var(--ink);border-radius:22px;padding:22px 28px;margin:16px 0;font-size:var(--fs);line-height:1.6;font-weight:800;box-shadow:0 14px 36px #0004;animation:pop .5s}
.q small{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:max(14px,calc(var(--fs)*.48));font-weight:600;color:var(--mut)}
.q.an{background:#ecfdf5;opacity:.88}
.q.new{outline:5px solid #fde68a}
.q .ok{color:#15803d}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.em{text-align:center;opacity:.85;margin:90px 10px;font-size:22px;line-height:1.8}
#er{display:none;margin:12px 0;background:#fef2f2;color:#7f1d1d;border:2px solid #dc2626;border-radius:14px;padding:10px 14px;font-weight:700}
#dot{width:11px;height:11px;border-radius:50%;background:#22c55e;display:inline-block;margin-inline-end:6px;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
</style>
</head>
<body>
<header>
  <h1><span id="dot"></span>أسئلة الجمهور<small id="ev"></small></h1>
  <span class="cnt" id="cnt">0</span>
  <div class="tools">
    <button onclick="fz(-4)" aria-label="تصغير الخط">أ−</button>
    <button onclick="fz(4)" aria-label="تكبير الخط">أ+</button>
    <button id="ha" onclick="tha()">إخفاء المجاب عنها</button>
    <button onclick="fsc()">⛶</button>
  </div>
</header>
<main>
  <div id="er"></div>
  <div id="ql"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(FB);
const db=firebase.firestore(),$=s=>document.querySelector(s),E=window.EVENT||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let Q=[],seen=null,fresh={},hideAns=ls('ps_ha','0')=='1',size=+ls('ps_fs','30');
$('#ev').textContent=E.title||'';
document.documentElement.style.setProperty('--fs',size+'px');
function fz(d){size=Math.max(18,Math.min(72,size+d));sv('ps_fs',size);document.documentElement.style.setProperty('--fs',size+'px')}
function tha(){hideAns=!hideAns;sv('ps_ha',hideAns?'1':'0');R()}
function fsc(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}
function R(){
  $('#ha').classList.toggle('on',hideAns);
  const all=Q.filter(q=>q.approved&&!q.hidden);
  const L=all.filter(q=>!hideAns||!q.answer).sort((a,b)=>(b.apTs?b.apTs.seconds:9e9)-(a.apTs?a.apTs.seconds:9e9));
  $('#cnt').textContent=all.length;
  $('#ql').innerHTML=L.length?L.map(q=>`<div class="q${q.answer?' an':''}${fresh[q.id]?' new':''}">${esc(q.text)}<small><span>${q.anon?'مجهول':esc(q.name||'')}</span>${q.votes?`<span>👍 ${q.votes}</span>`:''}${q.answer?'<span class="ok">✓ تمت الإجابة</span>':''}</small></div>`).join('')
   :`<div class="em">🎤<br>لسه مفيش أسئلة اتبعتت للمقدّمين.<br>هتظهر هنا أول ما الإدارة توافق عليها.</div>`}
function show(e){const el=$('#er');if(!e){el.style.display='none';return}
  const c=(e&&e.code)||'error';
  el.innerHTML=(!navigator.onLine?'📴 مفيش اتصال بالنت':c=='resource-exhausted'?'⛔ حصة Firebase خلصت — الصفحة مش هتتحدث لحد ما تتجدد':c=='permission-denied'?'⛔ الصلاحية مرفوضة':'⚠️ مشكلة في الاتصال')+' <small dir="ltr">('+esc(c)+')</small> — الأسئلة المعروضة ممكن تكون قديمة.';
  el.style.display='block'}
db.collection('questions').where('approved','==',true).onSnapshot(s=>{
  show(null);Q=s.docs.map(d=>({id:d.id,...d.data()}));
  if(seen===null)seen=new Set(Q.map(q=>q.id));
  else Q.forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);fresh[q.id]=1;setTimeout(()=>{delete fresh[q.id];R()},8000)}});
  R();
},e=>show(e));
window.addEventListener('offline',()=>show({code:'offline'}));
window.addEventListener('online',()=>show(null));
R();
</script>
</body>
</html>
