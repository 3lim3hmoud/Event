<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحضور</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#14213d;--pr:#2457d6;--bd:#dde3ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f1524;--cd:#19223a;--tx:#eef2ff;--pr:#6c8cff;--bd:#2c3858}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:12px}
.w{max-width:900px;margin:auto}.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;width:100%;margin-top:8px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-weight:700;margin:6px 4px 0 0}button.g{background:none;color:var(--pr);border:1px solid var(--bd)}
#rd{width:100%;max-width:380px;margin:auto}.row{display:flex;gap:8px}
#res{display:none;text-align:center;border-radius:16px;padding:16px;color:#fff;font-weight:700;font-size:18px}
#res img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #fff}#res.g{background:#16a34a}#res.y{background:#d97706}#res.r{background:#dc2626}
.st{display:flex;gap:8px;text-align:center}.st div{flex:1;background:var(--bg);border-radius:12px;padding:10px;font-size:13px}.st b{display:block;font-size:26px}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}td img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bd)}.hide{display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script></head><body><div class="w">
<div id="lg" class="c"><h2>دخول</h2><input id="code" placeholder="كود المساعد" autocapitalize="characters"><button onclick="loginStaff()">دخول</button>
<hr><small>أدمن؟</small><input id="em" type="email" placeholder="الإيميل" dir="ltr"><input id="pw" type="password" placeholder="الباسورد" dir="ltr"><button class="g" onclick="loginAdmin()">دخول الأدمن</button></div>
<div id="mn" class="hide"><div class="c"><button id="b1" onclick="tab(1)">الماسح</button><button id="b2" class="g hide" onclick="tab(2)">لوحة التحكم</button></div>
<div id="t1"><div class="c"><div id="rd"></div><div id="rd2" class="hide"></div><div id="ce" style="color:#dc2626;font-size:14px;margin-top:8px"></div><button class="g" onclick="scan()">تشغيل الكاميرا</button><button class="g" onclick="$('#fl').click()">صوّر QR</button><input id="fl" type="file" accept="image/*" capture="environment" class="hide" onchange="fscan(this)"><div class="row"><input id="man" placeholder="أو اكتب كود الطالب" dir="ltr" autocapitalize="characters"><button onclick="go($('#man').value)">تأكيد</button></div></div><div id="res"></div></div>
<div id="t2" class="hide"><div class="c st"><div><b id="s1">0</b>مسجل</div><div><b id="s2">0</b>حضر</div><div><b id="s3">0</b>لم يحضر</div><div><b id="s4">0</b>الحد</div></div>
<div class="c"><b>الإعدادات</b><div class="row"><input id="lim" type="number" placeholder="الحد الأقصى"><button onclick="setLim()">حفظ</button></div><button id="op" class="g" onclick="toggleOpen()"></button></div>
<div class="c"><b>أكواد المساعدين</b><div class="row"><input id="nc" placeholder="كود جديد" dir="ltr" autocapitalize="characters"><button onclick="addCode()">إضافة</button></div><div id="cl"></div></div>
<div class="c"><div class="row"><input id="q" placeholder="بحث بالاسم أو الكود" oninput="draw()"></div><button onclick="ex(0)">Excel الحاضرين</button><button class="g" onclick="ex(1)">Excel الكل</button>
<div class="tb"><table><thead><tr><th></th><th>الاسم</th><th>Name</th><th>الكود</th><th>الفرقة</th><th>الحالة</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div></div></div>
<script>
firebase.initializeApp(FB);const db=firebase.firestore(),auth=firebase.auth(),$=s=>document.querySelector(s),TS=firebase.firestore.FieldValue.serverTimestamp;
let isA=0,by='',stu=[],cfg={limit:0,open:true,count:0},sc,busy=0;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loginStaff(){const c=$('#code').value.trim().toUpperCase();try{const s=await db.doc('staff/'+c).get();if(!c||!s.exists)return alert('كود غلط');by=c;start(0)}catch(e){alert('خطأ اتصال')}}
async function loginAdmin(){try{await auth.signInWithEmailAndPassword($('#em').value,$('#pw').value);by='admin';start(1)}catch(e){alert('بيانات غلط')}}
function start(a){isA=a;$('#lg').classList.add('hide');$('#mn').classList.remove('hide');tab(1);scan();if(!a)return;$('#b2').classList.remove('hide');
db.doc('config/main').get().then(s=>{if(!s.exists)db.doc('config/main').set({limit:300,open:true,count:0})});
db.doc('config/main').onSnapshot(s=>{if(!s.exists)return;cfg=s.data();$('#s4').textContent=cfg.limit;$('#lim').value=cfg.limit;$('#op').textContent=cfg.open?'التسجيل مفتوح (اضغط للقفل)':'التسجيل مقفول (اضغط للفتح)'});
db.collection('students').orderBy('ts').onSnapshot(s=>{stu=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
db.collection('staff').onSnapshot(s=>{$('#cl').innerHTML=s.docs.map(d=>`<span class="tag">${esc(d.id)} <a href="#" onclick="db.doc('staff/${d.id}').delete();return false">✕</a></span> `).join('')})}
function tab(n){$('#t1').classList.toggle('hide',n!=1);$('#t2').classList.toggle('hide',n!=2);$('#b1').className=n==1?'':'g';$('#b2').className=(n==2?'':'g')+(isA?'':' hide')}
function scan(){$('#ce').textContent='';try{sc&&sc.isScanning&&sc.stop()}catch(e){}
sc=new Html5Qrcode('rd');sc.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},t=>go(t)).catch(e=>{$('#ce').textContent='الكاميرا مش شغالة: اسمح للكاميرا من إعدادات المتصفح وافتح اللينك في Chrome مش من جوه واتساب أو فيسبوك. أو استخدم زر "صوّر QR" تحت. ('+(e&&e.name||e)+')'})}
async function fscan(i){const f=i.files[0];if(!f)return;try{go(await new Html5Qrcode('rd2').scanFile(f,false))}catch(e){show('r','مقدرش يقرأ الـQR، صوّر تاني أقرب وفي إضاءة أحسن')}i.value=''}
function show(c,m,d){const r=$('#res');r.className=c;r.style.display='block';r.innerHTML=(d?`<img src="${d.photo}"><div>${esc(d.name)}</div><div dir="ltr">${esc(d.nameEn)}</div>`:'')+`<div>${m}</div>`;if(navigator.vibrate)navigator.vibrate(c=='g'?80:[200,100,200])}
async function go(raw){if(busy)return;busy=1;setTimeout(()=>busy=0,2500);const id=String(raw).trim().toUpperCase().replace(/\//g,'');if(!id)return;$('#man').value='';
try{const ref=db.doc('students/'+id),s=await ref.get();if(!s.exists)return show('r','كود غير صحيح');const d=s.data();
if(d.checkedIn)return show('y','دخل قبل كده '+(d.at?d.at.toDate().toLocaleTimeString('ar-EG'):''),d);
await ref.update({checkedIn:true,at:TS(),by});show('g','تم تأكيد الدخول ✓',d)}catch(e){show('r','خطأ اتصال أو كود غير صالح')}}
function draw(){const q=$('#q').value.trim().toLowerCase(),a=stu.filter(s=>s.checkedIn).length;$('#s1').textContent=stu.length;$('#s2').textContent=a;$('#s3').textContent=stu.length-a;
$('#tb').innerHTML=stu.filter(s=>!q||(s.name+s.nameEn+s.id+s.univ).toLowerCase().includes(q)).map(s=>`<tr><td><img src="${s.photo}"></td><td>${esc(s.name)}</td><td dir="ltr">${esc(s.nameEn)}</td><td>${s.id}</td><td>${esc(s.year)}</td><td>${s.checkedIn?'✓ حضر':'—'}</td><td><button class="g" onclick="tg('${s.id}',${!s.checkedIn})">${s.checkedIn?'إلغاء':'تأكيد'}</button></td></tr>`).join('')}
const tg=(id,v)=>db.doc('students/'+id).update({checkedIn:v,at:v?TS():null,by:v?'admin':null});
const setLim=()=>db.doc('config/main').update({limit:+$('#lim').value});
const toggleOpen=()=>db.doc('config/main').update({open:!cfg.open});
function addCode(){const c=$('#nc').value.trim().toUpperCase().replace(/\//g,'');if(c){db.doc('staff/'+c).set({});$('#nc').value=''}}
function ex(all){const rows=stu.filter(s=>all||s.checkedIn).map((s,i)=>({'#':i+1,'الاسم':s.name,'Name (Certificate)':s.nameEn,'الكود الجامعي':s.univ,'الفرقة':s.year,'الموبايل':s.phone,'الحضور':s.checkedIn?'حضر':'لم يحضر','وقت الدخول':s.at?s.at.toDate().toLocaleString('en-GB'):''}));
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Attendees');XLSX.writeFile(wb,'attendees.xlsx')}
</script></body></html>
