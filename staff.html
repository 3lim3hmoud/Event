<style>
:root{--bg:#f0fbfb;--cd:#fff;--tx:#0b3b3c;--pr:#0d9488;--bd:#d3ecec}

.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}td img{width:36px;height:36px;border-radius:50%;object-fit:cover}

#res.o{background:#475569}#res{animation:pop .35s}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.ov{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0f766e,#0d9488,#0ea5e9);color:#fff;text-align:center;padding:20px;overflow:auto}.ov button{background:#fff3}

.rn{font-size:36px;font-weight:800;margin:20px 0}.rn.win{font-size:42px;animation:pop .6s}.rp{width:160px;height:160px;border-radius:50%;object-fit:cover;border:5px solid #fff;margin-top:20px}

:root{--inp:#f8fdfd}[data-t=dark]{color-scheme:dark;--bg:#071a1c;--cd:#0d2528;--tx:#e6fbfa;--bd:#183c3f;--inp:#0a1f22}
body{background:radial-gradient(900px 400px at 80% -10%,#99f6e444,transparent),var(--bg)}.c{border-radius:20px}
input{background:var(--inp)!important;border-radius:12px}input:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 4px #0d948822}
.st{gap:10px}.st div{border-radius:16px;padding:14px 6px;position:relative;overflow:hidden}.st div:before{content:attr(data-i);position:absolute;top:4px;left:8px;font-size:18px;opacity:.5}.st b{background:linear-gradient(135deg,#0d9488,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
th{position:sticky;top:0;background:var(--cd);z-index:1}tbody tr:hover td{background:#0d94880d}.chip{padding:3px 10px;border-radius:99px;background:var(--bd);font-size:12px}.chip.ok{background:#16a34a;color:#fff}
.scw{position:relative;max-width:380px;margin:auto;border-radius:18px;overflow:hidden;background:#0b3b3c;min-height:240px}.scw #rd{max-width:100%}
.sl{position:absolute;left:8%;right:8%;top:10%;height:3px;background:linear-gradient(90deg,transparent,#34d399,transparent);box-shadow:0 0 14px #34d399;animation:scn 2.4s ease-in-out infinite;pointer-events:none;z-index:2}@keyframes scn{50%{top:88%}}
.scw b{position:absolute;width:34px;height:34px;border:4px solid #34d399;z-index:2;pointer-events:none}.k1{top:10px;left:10px;border-right:0!important;border-bottom:0!important;border-radius:12px 0 0 0}.k2{top:10px;right:10px;border-left:0!important;border-bottom:0!important;border-radius:0 12px 0 0}.k3{bottom:10px;left:10px;border-right:0!important;border-top:0!important;border-radius:0 0 0 12px}.k4{bottom:10px;right:10px;border-left:0!important;border-top:0!important;border-radius:0 0 12px 0}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="config.js"></script></head><body><div class="w">
<div id="lg" class="c"><h2>دخول</h2><input id="code" placeholder="كود المساعد" autocapitalize="characters"><button onclick="loginStaff()">دخول</button>
<hr><small>أدمن؟</small><input id="em" type="email" placeholder="الإيميل" dir="ltr"><input id="pw" type="password" placeholder="الباسورد" dir="ltr"><button class="g" onclick="loginAdmin()">دخول الأدمن</button></div>
<div id="mn" class="hide"><div class="c"><button id="b1" onclick="tab(1)">الماسح</button><button class="g" onclick="localStorage.removeItem('sc');location.reload()">خروج</button><button class="g" onclick="const d=document.documentElement,n=d.dataset.t=='dark'?'light':'dark';d.dataset.t=n;localStorage.t=n">🌓</button><button id="b2" class="g hide" onclick="tab(2)">لوحة التحكم</button></div>
<div id="t1"><div class="c"><div class="scw"><div id="rd"></div><i class="sl"></i><b class="k1"></b><b class="k2"></b><b class="k3"></b><b class="k4"></b></div><div id="rd2" class="hide"></div><div id="ce" style="color:#dc2626;font-size:14px;margin-top:8px"></div><div id="pq" style="text-align:center;font-weight:700;color:#d97706;margin-top:6px"></div><button class="g" onclick="scan()">تشغيل الكاميرا</button><button class="g" onclick="$('#fl').click()">صوّر QR</button><input id="fl" type="file" accept="image/*" capture="environment" class="hide" onchange="fscan(this)"><div class="row"><input id="man" placeholder="أو اكتب كود الطالب" dir="ltr" autocapitalize="characters"><button onclick="go($('#man').value)">تأكيد</button></div></div><div id="res"></div></div>
<div id="t2" class="hide"><div class="c"><button onclick="bs(1)">📺 شاشة العرض</button><button onclick="raffle()">🎁 سحب عشوائي</button></div><div class="c st"><div data-i="👥"><b id="s1">0</b>مسجل</div><div data-i="✅"><b id="s2">0</b>حضر</div><div data-i="⏳"><b id="s3">0</b>لم يحضر</div><div data-i="🎯"><b id="s4">0</b>الحد</div></div>
<div class="c"><div class="meter" style="height:14px"><u id="pgb" style="width:0;background:linear-gradient(90deg,#0d9488,#38bdf8);transition:width .8s"></u></div><small id="pgt"></small></div>
<div class="c"><b>تحليلات الحضور</b><div id="an"></div><div id="fb" style="margin-top:10px;font-size:14px"></div></div>
<div class="c"><b>الإعدادات</b><div class="row"><input id="lim" type="number" placeholder="الحد الأقصى"><button onclick="setLim()">حفظ</button></div><div class="row"><input id="nt" placeholder="إعلان يظهر للطلاب (اتركه فاضي للإخفاء)"><button onclick="setNt()">نشر</button></div><button id="op" class="g" onclick="toggleOpen()"></button></div>
<div class="c"><b>أكواد المساعدين</b><div class="row"><input id="nc" placeholder="كود جديد" dir="ltr" autocapitalize="characters"><button onclick="addCode()">إضافة</button></div><div id="cl"></div></div>
<div class="c"><b>قايمة الانتظار <span id="wc"></span></b><div id="wb"></div></div>
<div class="c"><input id="wm" placeholder="رسالة واتساب (تتفتح مع زر 💬 جنب كل اسم)" oninput="draw()"><div class="row" style="margin-top:8px"><input id="q" placeholder="بحث بالاسم أو الكود" oninput="draw()"></div><button onclick="ex()">Excel (كل الشيتات)</button><button class="g" onclick="pr()">طباعة قايمة الحضور</button>
<div class="tb"><table><thead><tr><th></th><th>الاسم</th><th>Name</th><th>الكود</th><th>الفرقة</th><th>الحالة</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div></div></div>
<div id="bs" class="ov hide"><button onclick="bs(0)" style="position:absolute;top:12px;left:12px">✕</button><h2 id="bt"></h2><div>تم تسجيل حضور</div><div id="bn">0</div><div id="bsub" style="font-size:22px;margin-bottom:12px"></div><div id="bl"></div></div>
<div id="rf" class="ov hide"><button onclick="$('#rf').classList.add('hide')" style="position:absolute;top:12px;left:12px">✕</button><h1>🎁 السحب العشوائي</h1><div id="rb" style="min-height:300px"></div><button onclick="raffle()" style="padding:14px 26px;font-size:18px">اسحب تاني</button></div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
firebase.initializeApp(FB);const db=firebase.firestore(),auth=firebase.auth(),$=s=>document.querySelector(s),TS=firebase.firestore.FieldValue.serverTimestamp;
let isA=0,by='',stu=[],cfg={limit:0,open:true,count:0},sc,busy=0;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loginStaff(){const c=$('#code').value.trim().toUpperCase();try{const s=await db.doc('staff/'+c).get();if(!c||!s.exists)return alert('كود غلط');by=c;localStorage.sc=c;start(0)}catch(e){alert('خطأ اتصال')}}
async function loginAdmin(){try{await auth.signInWithEmailAndPassword($('#em').value,$('#pw').value);by='admin';start(1)}catch(e){alert('بيانات غلط')}}
function start(a){isA=a;sq();sync();setInterval(sync,15000);$('#lg').classList.add('hide');$('#mn').classList.remove('hide');tab(1);scan();if(!a)return;$('#b2').classList.remove('hide');
db.doc('config/main').get().then(s=>{if(!s.exists)db.doc('config/main').set({limit:300,open:true,count:0})});
db.doc('config/main').onSnapshot(s=>{if(!s.exists)return;cfg=s.data();cu($('#s4'),cfg.limit);$('#lim').value=cfg.limit;if(document.activeElement!==$('#nt'))$('#nt').value=cfg.notice||'';$('#op').textContent=cfg.open?'التسجيل مفتوح (اضغط للقفل)':'التسجيل مقفول (اضغط للفتح)'});
db.collection('students').orderBy('ts').onSnapshot(s=>{stu=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
db.collection('feedback').onSnapshot(s=>{const a=s.docs.map(d=>d.data()),av=k=>{const v=a.filter(x=>x[k]);return v.length?(v.reduce((x,y)=>x+y[k],0)/v.length).toFixed(1):'-'},rc=r=>a.filter(x=>x.rec==r).length;$('#fb').innerHTML=`⭐ عام <b>${av('stars')}</b> • المحتوى <b>${av('content')}</b> • التنظيم <b>${av('org')}</b> (${a.length} تقييم)<br>هينصحوا: نعم ${rc('نعم')} • ممكن ${rc('ممكن')} • لا ${rc('لا')}`+a.filter(x=>x.comment).slice(-5).map(x=>`<div style="margin-top:4px">${'★'.repeat(x.stars)} ${esc(x.comment)}</div>`).join('')});
db.collection('waitlist').orderBy('ts').onSnapshot(s=>{WL=s.docs.map(d=>({id:d.id,...d.data()}));$('#wc').textContent='('+WL.length+')';$('#wb').innerHTML=WL.map(w=>`<div style="padding:6px 0;border-bottom:1px dashed var(--bd)">${esc(w.name)} • ${esc(w.year)} • <a class="wab" target="_blank" href="${wa(w.phone)}">💬 ${esc(w.phone)}</a> <a href="#" onclick="db.doc('waitlist/${w.id}').delete();return false">✕</a></div>`).join('')||'<small>لا أحد</small>'});
db.collection('staff').onSnapshot(s=>{$('#cl').innerHTML=s.docs.map(d=>`<span class="tag">${esc(d.id)} <a href="#" onclick="db.doc('staff/${d.id}').delete();return false">✕</a></span> `).join('')})}
function tab(n){$('#t1').classList.toggle('hide',n!=1);$('#t2').classList.toggle('hide',n!=2);$('#b1').className=n==1?'':'g';$('#b2').className=(n==2?'':'g')+(isA?'':' hide')}
function scan(){$('#ce').textContent='';try{sc&&sc.isScanning&&sc.stop()}catch(e){}
sc=new Html5Qrcode('rd');sc.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},t=>go(t)).catch(e=>{$('#ce').textContent='الكاميرا مش شغالة: اسمح للكاميرا من إعدادات المتصفح وافتح اللينك في Chrome مش من جوه واتساب أو فيسبوك. أو استخدم زر "صوّر QR" تحت. ('+(e&&e.name||e)+')'})}
async function fscan(i){const f=i.files[0];if(!f)return;try{go(await new Html5Qrcode('rd2').scanFile(f,false))}catch(e){show('r','مقدرش يقرأ الـQR، صوّر تاني أقرب وفي إضاءة أحسن')}i.value=''}
function beep(c){try{const a=new(window.AudioContext||window.webkitAudioContext)(),f=c=='g'?[880,1320]:c=='y'?[600,600]:[220,160];f.forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=h;o.type=c=='r'?'sawtooth':'sine';o.connect(g);g.connect(a.destination);g.gain.value=.25;o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+.15)})}catch(e){}}
function show(c,m,d,id){const r=$('#res');r.className=c;r.style.display='block';r.style.animation='none';r.offsetHeight;r.style.animation='';r.innerHTML=(d?`<img src="${d.photo}"><div>${esc(d.name)}</div><div dir="ltr">${esc(d.nameEn)}</div>`:'')+`<div>${m}</div>`+(id?`<button onclick="undo('${id}')" style="background:#fff;color:#111;margin-top:10px">↩ تراجع</button>`:'');beep(c);if(navigator.vibrate)navigator.vibrate(c=='g'?80:[200,100,200])}
async function undo(id){try{await db.doc('students/'+id).update({checkedIn:false,at:null,by});show('y','تم التراجع عن التأكيد')}catch(e){show('r','مقدرتش أتراجع')}}
let Q=JSON.parse(localStorage.getItem('q')||'[]'),syn=0,WL=[],W=[];
const sq=()=>{localStorage.setItem('q',JSON.stringify(Q));$('#pq').textContent=Q.length?'⏳ '+Q.length+' مسح أوفلاين بانتظار المزامنة':''};
function qa(id){if(Q.some(x=>x.id==id))return show('y','ممسوح أوفلاين قبل كده');Q.push({id,at:Date.now(),by});sq();show('o','📴 محفوظ أوفلاين، هيتأكد لما النت يرجع')}
async function sync(){if(!navigator.onLine||!Q.length||syn)return;syn=1;let ok=0,bad=0;for(const q of [...Q]){try{const r=db.doc('students/'+q.id),s=await r.get();if(!s.exists)bad++;else if(!s.data().checkedIn){await r.update({checkedIn:true,at:firebase.firestore.Timestamp.fromMillis(q.at),by:q.by});ok++}Q=Q.filter(x=>x.id!=q.id);sq()}catch(e){break}}syn=0;if(ok||bad)show('g','تمت مزامنة '+ok+' دخول'+(bad?' • '+bad+' كود غير صحيح':''))}
addEventListener('online',sync);
async function go(raw){if(busy)return;busy=1;setTimeout(()=>busy=0,2500);const id=String(raw).trim().toUpperCase().replace(/\//g,'');if(!id)return;$('#man').value='';if(!navigator.onLine)return qa(id);
try{const ref=db.doc('students/'+id),s=await ref.get();if(!s.exists)return show('r','كود غير صحيح');const d=s.data();
if(d.checkedIn)return show('y','دخل قبل كده '+(d.at?d.at.toDate().toLocaleTimeString('ar-EG'):''),d);
await ref.update({checkedIn:true,at:TS(),by});show('g','تم تأكيد الدخول ✓',d,id)}catch(e){if(!navigator.onLine||e.code=='unavailable')return qa(id);show('r','خطأ اتصال أو كود غير صالح')}}
const bars=(o,t,lab=x=>x)=>{const k=Object.keys(o).sort(),m=Math.max(1,...Object.values(o));return `<div style="margin-top:14px;font-size:13px">${t}<div style="display:flex;align-items:flex-end;gap:4px;margin-top:6px">${k.map(x=>`<div style="flex:1;text-align:center;font-size:10px"><div style="background:linear-gradient(#38bdf8,#0d9488);border-radius:4px 4px 0 0;height:${o[x]/m*70+2}px"></div>${lab(x)}<br>${o[x]}</div>`).join('')}</div></div>`};
const wa=p=>{let n=String(p||'').replace(/\D/g,'');if(n[0]=='0')n='2'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(($('#wm')||{}).value||'')};
function cu(el,v){const f=+el.dataset.v||0;el.dataset.v=v;if(f==v){el.textContent=v;return}const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(f+(v-f)*p);if(p<1)requestAnimationFrame(s)})(t0)}
function an(){const y={},st={},hh={},dd={};stu.forEach(s=>{if(s.ts&&s.ts.toDate){const k=s.ts.toDate().toISOString().slice(0,10);dd[k]=(dd[k]||0)+1}if(s.checkedIn&&s.at&&s.at.toDate){const k=String(s.at.toDate().getHours()).padStart(2,'0')+':00';hh[k]=(hh[k]||0)+1}const k=s.year||'-';y[k]=y[k]||[0,0];y[k][0]++;if(s.checkedIn){y[k][1]++;st[s.by]=(st[s.by]||0)+1}});const mx=Math.max(1,...Object.values(y).map(v=>v[0]));
$('#an').innerHTML=Object.entries(y).map(([k,v])=>`<div style="margin:8px 0;font-size:13px">فرقة ${esc(k)}: حضر ${v[1]} من ${v[0]}<div class="meter"><u style="width:${v[0]/mx*100}%"><i style="width:${v[1]/v[0]*100}%"></i></u></div></div>`).join('')+bars(hh,'الدخول حسب الساعة')+bars(dd,'التسجيل حسب اليوم',x=>x.slice(5))+'<small>الحضور حسب المساعد: '+(Object.entries(st).map(([k,v])=>esc(k)+' ('+v+')').join('، ')||'-')+'</small>'}
const setNt=()=>db.doc('config/main').update({notice:$('#nt').value.trim()});
function draw(){an();if(!$('#bs').classList.contains('hide'))bsr();const q=$('#q').value.trim().toLowerCase(),a=stu.filter(s=>s.checkedIn).length;cu($('#s1'),stu.length);cu($('#s2'),a);cu($('#s3'),stu.length-a);$('#pgb').style.width=(stu.length?a/stu.length*100:0)+'%';$('#pgt').textContent='نسبة الحضور من المسجلين: '+(stu.length?Math.round(a/stu.length*100):0)+'%';
$('#tb').innerHTML=stu.filter(s=>!q||(s.name+s.nameEn+s.id+s.univ).toLowerCase().includes(q)).map(s=>`<tr><td><img src="${s.photo}"></td><td>${esc(s.name)}</td><td dir="ltr">${esc(s.nameEn)}</td><td>${s.id}</td><td>${esc(s.year)}</td><td><span class="chip${s.checkedIn?' ok':''}">${s.checkedIn?'✓ حضر':'لم يحضر'}</span></td><td><button class="g" onclick="tg('${s.id}',${!s.checkedIn})">${s.checkedIn?'إلغاء':'تأكيد'}</button> <a class="wab" target="_blank" href="${wa(s.phone)}">💬</a></td></tr>`).join('')}
const tg=(id,v)=>db.doc('students/'+id).update({checkedIn:v,at:v?TS():null,by:v?'admin':null});
const setLim=()=>db.doc('config/main').update({limit:+$('#lim').value});
const toggleOpen=()=>db.doc('config/main').update({open:!cfg.open});
function addCode(){const c=$('#nc').value.trim().toUpperCase().replace(/\//g,'');if(c){db.doc('staff/'+c).set({});$('#nc').value=''}}
const rw=(s,i)=>({'#':i+1,'الاسم':s.name,'Name (Certificate)':s.nameEn,'الكود الجامعي':s.univ,'الفرقة':s.year,'الموبايل':s.phone,'الحضور':s.checkedIn?'حضر':'لم يحضر','وقت الدخول':s.at&&s.at.toDate?s.at.toDate().toLocaleString('en-GB'):'','المساعد':s.by||''});
function ex(){const wb=XLSX.utils.book_new(),ad=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n);ad('الحاضرون',stu.filter(s=>s.checkedIn).map(rw));ad('الغائبون',stu.filter(s=>!s.checkedIn).map(rw));ad('الكل',stu.map(rw));ad('قايمة الانتظار',WL.map((w,i)=>({'#':i+1,'الاسم':w.name,'Name':w.nameEn,'الكود':w.univ,'الفرقة':w.year,'الموبايل':w.phone})));XLSX.writeFile(wb,'attendees.xlsx')}
function pr(){const w=open('','_blank');w.document.write('<html dir="rtl"><meta charset="utf-8"><title>قايمة الحضور</title><style>body{font-family:sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:6px;font-size:14px;text-align:right}</style><h2>'+esc(EVENT.title)+'</h2><table><tr><th>#</th><th>الاسم</th><th>الكود</th><th>الفرقة</th><th>الحضور</th><th>التوقيع</th></tr>'+stu.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${s.id}</td><td>${esc(s.year)}</td><td>${s.checkedIn?'✓':''}</td><td></td></tr>`).join('')+'</table>');w.document.close();w.print()}
function bs(on){$('#bs').classList.toggle('hide',!on);if(on){bsr();document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}else document.fullscreenElement&&document.exitFullscreen()}
function bsr(){const a=stu.filter(s=>s.checkedIn),ms=s=>s.at&&s.at.toMillis?s.at.toMillis():0;$('#bt').textContent=EVENT.title;$('#bn').textContent=a.length;$('#bsub').textContent='من '+stu.length+' مسجل • '+(stu.length?Math.round(a.length/stu.length*100):0)+'%';
$('#bl').innerHTML=a.sort((x,y)=>ms(y)-ms(x)).slice(0,6).map(s=>`<div class="la"><img src="${s.photo}"><span>${esc(s.name)}</span></div>`).join('')}
function raffle(){const p=stu.filter(s=>s.checkedIn&&!W.includes(s.id));if(!p.length)return alert('مفيش حاضرين متاحين للسحب');$('#rf').classList.remove('hide');const b=$('#rb'),pk=()=>p[Math.floor(Math.random()*p.length)];let n=0;const t=setInterval(()=>{b.innerHTML=`<div class="rn">${esc(pk().name)}</div>`;if(++n>30){clearInterval(t);const w=pk();W.push(w.id);b.innerHTML=`<img src="${w.photo}" class="rp"><div class="rn win">🎉 ${esc(w.name)}</div><div>${w.id}</div>`;beep('g')}},100)}
if(localStorage.sc){by=localStorage.sc;start(0)}
</script></body></html>
